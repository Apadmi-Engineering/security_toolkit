name: flutter_security_suite
description: "Security utilities for Flutter apps"
version: 1.0.0
homepage:

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  pigeon: ^26.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.apadmi.flutter_security_suite
        pluginClass: FlutterSecuritySuitePlugin
      ios:
        pluginClass: FlutterSecuritySuitePlugin
