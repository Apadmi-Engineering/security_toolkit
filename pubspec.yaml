name: security_toolkit
description: "Security utilities for Flutter apps"
version: 2.0.0
homepage:

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  pigeon: ">=26.1.1 <29.0.0"
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.apadmi.security_toolkit
        pluginClass: SecurityToolkitPlugin
      ios:
        pluginClass: SecurityToolkitPlugin
